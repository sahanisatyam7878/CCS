<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Database MySQL Overview</title>
  <desc id="desc">A clean educational diagram showing MySQL database tables, SQL queries, and connected application data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#e8fff5"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6cbd"/>
      <stop offset="100%" stop-color="#00bfff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f3554" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <circle cx="805" cy="95" r="76" fill="#d7f5ff"/>
  <circle cx="120" cy="432" r="88" fill="#dff8eb"/>

  <g filter="url(#shadow)">
    <rect x="70" y="64" width="820" height="412" rx="24" fill="#ffffff" stroke="#c9e2f1"/>
  </g>

  <text x="110" y="125" fill="#16384f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Database (MySQL)</text>
  <text x="112" y="164" fill="#4d6b7c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Store, organize, search, update, and protect data with SQL tables.</text>

  <g transform="translate(116 220)">
    <ellipse cx="140" cy="34" rx="132" ry="34" fill="url(#primary)"/>
    <rect x="8" y="34" width="264" height="150" fill="#0f6cbd"/>
    <ellipse cx="140" cy="184" rx="132" ry="34" fill="#084b86"/>
    <ellipse cx="140" cy="84" rx="132" ry="34" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <ellipse cx="140" cy="134" rx="132" ry="34" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <rect x="92" y="78" width="96" height="36" fill="#0f6cbd"/>
    <text x="140" y="145" text-anchor="middle" fill="#dff6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Database Server</text>
  </g>

  <g transform="translate(462 210)">
    <rect x="0" y="0" width="332" height="214" rx="18" fill="#f8fbfd" stroke="#cfe4f3" stroke-width="2"/>
    <rect x="0" y="0" width="332" height="50" rx="18" fill="#16384f"/>
    <path d="M0 32 H332 V50 H0 Z" fill="#16384f"/>
    <text x="24" y="33" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">students table</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
      <text x="24" y="84" fill="#0f6cbd" font-weight="800">student_id</text>
      <text x="132" y="84" fill="#0f6cbd" font-weight="800">name</text>
      <text x="226" y="84" fill="#0f6cbd" font-weight="800">course</text>
      <line x1="20" y1="100" x2="312" y2="100" stroke="#d9e8f2"/>

      <text x="24" y="128" fill="#31566e">1</text>
      <text x="132" y="128" fill="#31566e">Riya</text>
      <text x="226" y="128" fill="#31566e">MySQL</text>
      <line x1="20" y1="145" x2="312" y2="145" stroke="#e8f1f6"/>

      <text x="24" y="173" fill="#31566e">2</text>
      <text x="132" y="173" fill="#31566e">Aman</text>
      <text x="226" y="173" fill="#31566e">Python</text>
    </g>
  </g>

  <g transform="translate(146 438)">
    <rect x="0" y="0" width="668" height="54" rx="14" fill="#102a43"/>
    <text x="28" y="35" fill="#7dd3fc" font-family="Consolas, Courier New, monospace" font-size="20">SELECT name, course FROM students WHERE course = 'MySQL';</text>
  </g>

  <g stroke="#0f6cbd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M395 322 C425 322 425 318 452 318"/>
    <path d="M438 304 L452 318 L438 332"/>
  </g>

  <g transform="translate(690 96)">
    <rect x="0" y="0" width="144" height="44" rx="22" fill="#e8f7ff" stroke="#93d9f7"/>
    <text x="72" y="29" text-anchor="middle" fill="#0f6cbd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">SQL Queries</text>
  </g>

  <g transform="translate(646 148)" fill="#ffffff" stroke="#cfe4f3" stroke-width="2">
    <rect x="0" y="0" width="112" height="34" rx="10"/>
    <rect x="124" y="0" width="112" height="34" rx="10"/>
    <rect x="62" y="46" width="112" height="34" rx="10"/>
  </g>
  <g fill="#31566e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <text x="702" y="170" text-anchor="middle">INSERT</text>
    <text x="826" y="170" text-anchor="middle">UPDATE</text>
    <text x="764" y="216" text-anchor="middle">SELECT</text>
  </g>
</svg>
